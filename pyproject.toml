[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tenantledger"
version = "1.0.0"
description = "Multi-tenant expense approvals and an executable authorization security lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "SQLAlchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3",
  "itsdangerous>=2.2,<3", "cryptography>=44", "python-multipart>=0.0.20",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6", "hypothesis>=6", "ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["identity: exercises the real Keycloak server", "browser: full browser workflow"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
