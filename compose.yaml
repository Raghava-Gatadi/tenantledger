name: tenantledger
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger_owner
      POSTGRES_PASSWORD: local-owner-password
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - ledger-db:/var/lib/postgresql
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_owner -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: local-keycloak-password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-password
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; cat <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ledger_owner:local-owner-password@postgres:5432/ledger
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ledger_app:local-app-password@postgres:5432/ledger
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/tenantledger
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
  tests:
    build: {context: ., target: test}
    profiles: ["test"]
    user: "0:0"
    volumes: ["./artifacts:/srv/ledger/artifacts"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ledger_app:local-app-password@postgres:5432/ledger_test
      TEST_OWNER_URL: postgresql+psycopg://ledger_owner:local-owner-password@postgres:5432/ledger_test
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/tenantledger
      KEYCLOAK_BASE_URL: http://keycloak:8080
    command: ["sh", "-c", "DATABASE_URL=$$TEST_OWNER_URL alembic upgrade head && python -m pytest --cov=app --cov-report=term-missing --cov-report=json:artifacts/coverage.json --junitxml=artifacts/tests.xml"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
volumes:
  ledger-db:
