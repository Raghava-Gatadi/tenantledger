name: Security regression suite
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install verification tools
        run: |
          python -m pip install -r requirements-test.lock playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Lint
        run: python -m ruff check app tests lab scripts alembic
      - name: Start local application
        run: make up
      - name: Application, database and real identity tests
        run: make test
      - name: Prove regressions detect vulnerable variants
        run: make lab
      - name: Real browser workflow
        run: python scripts/browser_smoke.py
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenantledger-verification
          path: artifacts/
      - name: Service diagnostics
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop services
        if: always()
        run: docker compose down
